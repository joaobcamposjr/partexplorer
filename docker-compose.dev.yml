version: '3.8'

services:
  # Nginx Reverse Proxy para Desenvolvimento
  nginx-dev:
    build: ./nginx
    container_name: partexplorer-nginx-dev
    restart: unless-stopped
    ports:
      - "9443:443"  # Porta diferente para desenvolvimento
    volumes:
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
    depends_on:
      - frontend-dev
      - backend-dev
    networks:
      - partexplorer-dev-network
    environment:
      - ENVIRONMENT=development

  # Frontend para Desenvolvimento
  frontend-dev:
    build: ./frontend
    container_name: partexplorer-frontend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=https://dev.proencalho.com
    networks:
      - partexplorer-dev-network
    depends_on:
      - backend-dev

  # Backend para Desenvolvimento
  backend-dev:
    build: ./backend
    container_name: partexplorer-backend-dev
    restart: unless-stopped
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=jbcdev
      - DB_PASSWORD=jbcpassar
      - DB_NAME=procatalog
      - REDIS_HOST=redis
      - ELASTICSEARCH_HOST=elasticsearch
      - ENVIRONMENT=development
    networks:
      - partexplorer-dev-network
    depends_on:
      - redis
      - elasticsearch

  # Redis (compartilhado)
  redis:
    image: redis:7-alpine
    container_name: partexplorer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - partexplorer-dev-network

  # Elasticsearch (compartilhado)
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: partexplorer-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - partexplorer-dev-network

networks:
  partexplorer-dev-network:
    driver: bridge

volumes:
  elasticsearch_data:
