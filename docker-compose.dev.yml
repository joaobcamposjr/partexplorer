version: '3.8'

services:
  # Nginx Reverse Proxy (DEV)
  nginx-dev:
    build: ./nginx
    container_name: partexplorer-nginx-dev
    restart: unless-stopped
    ports:
      - "9443:443"
    volumes:
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
    depends_on:
      - frontend-dev
      - backend-dev
    networks:
      - partexplorer-dev-network
    environment:
      - ENVIRONMENT=development
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Frontend React (DEV)
  frontend-dev:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: partexplorer-frontend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=https://dev.proencalho.com:9443
    env_file:
      - ./frontend/env.development
    networks:
      - partexplorer-dev-network
    depends_on:
      - backend-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Backend API (DEV)
  backend-dev:
    build: ./backend
    container_name: partexplorer-backend-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=95.217.76.135
      - DB_PORT=5432
      - DB_USER=jbcdev
      - DB_PASSWORD=jbcpassar
      - DB_NAME=procatalog
      - REDIS_HOST=redis
      - ELASTICSEARCH_HOST=elasticsearch
      - ENVIRONMENT=development
    networks:
      - partexplorer-dev-network
    depends_on:
      - redis
      - elasticsearch
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Redis Cache (DEV)
  redis:
    image: redis:7-alpine
    container_name: partexplorer-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - partexplorer-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Elasticsearch (DEV)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: partexplorer-elasticsearch-dev
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    ports:
      - "9210:9200"
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    networks:
      - partexplorer-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

volumes:
  elasticsearch_dev_data:
  redis_dev_data:

networks:
  partexplorer-dev-network:
    driver: bridge
