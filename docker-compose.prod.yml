version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: partexplorer-backend
    restart: unless-stopped
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=jbcdev
      - DB_PASSWORD=jbcpassar
      - DB_NAME=procatalog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      - redis
      - elasticsearch
    networks:
      - partexplorer-network
    volumes:
      - ./logs/backend:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend React
  frontend:
    build: ./frontend
    container_name: partexplorer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=https://proencalho.com:8443
    env_file:
      - ./frontend/env.production
    depends_on:
      - backend
    networks:
      - partexplorer-network



  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: partexplorer-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - partexplorer-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: partexplorer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - partexplorer-network

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    container_name: partexplorer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
    depends_on:
      - frontend
      - backend
    networks:
      - partexplorer-network

volumes:
  elasticsearch_data:
  redis_data:

networks:
  partexplorer-network:
    driver: bridge 
  redis_data:

networks:
  partexplorer-network:
    driver: bridge 