version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: partexplorer-backend
    restart: unless-stopped
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=jbcdev
      - DB_PASSWORD=jbcpassar
      - DB_NAME=procatalog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      - redis
      - elasticsearch
    volumes:
      - ./logs/backend:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend React
  frontend:
    build: ./frontend
    container_name: partexplorer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=https://proencalho.com
    env_file:
      - ./frontend/env.production
    depends_on:
      - backend

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: partexplorer-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: partexplorer-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    container_name: partexplorer-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8443:443"
    depends_on:
      - frontend
      - backend

volumes:
  elasticsearch_data:
  redis_data:

networks:
  default:
    driver: bridge
